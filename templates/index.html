<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MindBloom — Preventive Mental Wellness</title>
<style>
:root{--navy:#0B2742;--blue:#2563A6;--soft:#EAF2FA;--bg:#F6F8FB;--white:#fff;--line:#DCE5EF;--text:#18324A;--muted:#6B7C8F;--green:#2E7D5B;--amber:#D99A24;--red:#C95C54}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px Inter,Arial,sans-serif}button,input,select{font:inherit}button{cursor:pointer}
.top{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:20}.brand{font-size:23px;font-weight:900;color:var(--navy)}.brand span{color:var(--blue)}
.layout{display:flex;min-height:calc(100vh - 68px)}.side{width:245px;background:var(--navy);padding:18px 13px;position:fixed;top:68px;bottom:0;color:#fff}.main{margin-left:245px;width:calc(100% - 245px);padding:30px;max-width:1500px}
.nav{width:100%;text-align:left;background:transparent;color:#cbd9e6;border:0;border-radius:9px;padding:11px 12px;margin:2px 0}.nav:hover,.nav.on{background:rgba(255,255,255,.11);color:#fff}
h1{margin:0;color:var(--navy);font-size:30px}h2{margin:0 0 14px;color:var(--navy);font-size:20px}.sub{color:var(--muted);margin:6px 0 24px}
.grid{display:grid;gap:18px}.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 8px 26px rgba(11,39,66,.06)}
.btn{border:0;border-radius:10px;padding:11px 16px;font-weight:700}.primary{background:var(--blue);color:#fff}.secondary{background:var(--soft);color:var(--navy)}.outline{background:#fff;border:1px solid var(--line);color:var(--text)}
.stat{font-size:30px;font-weight:900;color:var(--navy)}.muted{font-size:13px;color:var(--muted)}.pill{display:inline-block;border-radius:30px;padding:5px 10px;font-size:12px;font-weight:800}.normal{background:#e7f4ed;color:var(--green)}.attention{background:#fff3d9;color:#946a0d}.concern{background:#fce9e5;color:#a5463c}
.choice{border:1px solid var(--line);background:#fff;border-radius:12px;padding:15px;text-align:left}.choice.sel{border:2px solid var(--blue);background:var(--soft)}
.field{display:flex;flex-direction:column;gap:7px;margin-bottom:14px}.field label{font-size:13px;font-weight:800}input,select{border:1px solid var(--line);border-radius:10px;padding:12px;background:#fff;width:100%}
.auth{min-height:100vh;display:grid;grid-template-columns:1fr 1fr}.hero{background:linear-gradient(145deg,var(--navy),#1f5c8e);color:#fff;padding:70px;display:flex;flex-direction:column;justify-content:center}.hero h1{color:#fff;font-size:48px;max-width:560px}.hero p{max-width:520px;color:#dceaf5;font-size:17px}.authbox{display:flex;align-items:center;justify-content:center;padding:30px}.formbox{width:min(450px,92vw);background:#fff;padding:34px;border-radius:20px;box-shadow:0 15px 45px rgba(11,39,66,.1)}
.hide{display:none!important}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.stack>*+*{margin-top:12px}.progress{height:9px;background:#e8eef4;border-radius:9px;overflow:hidden}.progress i{display:block;height:100%;background:var(--blue)}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:12px;border-bottom:1px solid var(--line);font-size:13px}.toast{position:fixed;right:22px;bottom:22px;background:var(--navy);color:#fff;padding:13px 17px;border-radius:10px;display:none;z-index:100}
.checkin{max-width:900px;margin:auto}.mood{font-size:28px;text-align:center}.result{background:linear-gradient(135deg,#f0f7fc,#fff);border:1px solid #d8e8f5}
@media(max-width:900px){.side{display:none}.main{margin-left:0;width:100%;padding:20px}.g4{grid-template-columns:repeat(2,1fr)}.auth{grid-template-columns:1fr}.hero{display:none}}
@media(max-width:600px){.g2,.g3,.g4{grid-template-columns:1fr}.top{padding:0 15px}.main{padding:15px}h1{font-size:25px}.formbox{padding:25px}.choice{padding:13px}}
.resource-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:18px}.resource-card{border:1px solid var(--line);border-radius:14px;padding:16px;background:#fbfdff}.resource-card.urgent{border-color:#efc9c5;background:#fff8f7}.resource-top{display:flex;justify-content:space-between;gap:10px}.resource-category{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:800}.resource-card h3{margin:5px 0;color:var(--navy)}.resource-card p{font-size:13px;color:var(--muted);line-height:1.5}.resource-number{font-size:18px;font-weight:900;color:var(--blue);white-space:nowrap}.call-btn{text-decoration:none;display:inline-block}.danger{background:var(--red);color:#fff}.emergency-note{margin-top:16px;background:#fff5f3;color:#8d3d36}.task-card{border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;align-items:center;justify-content:space-between;gap:15px}.task-card h3{margin:5px 0;color:var(--navy);font-size:15px}.task-card p{margin:0;color:var(--muted);font-size:12px;line-height:1.4}.task-tag{font-size:10px;text-transform:uppercase;letter-spacing:.7px;color:var(--blue);font-weight:900}.metric{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid #edf1f5}.metric:last-child{border-bottom:0}.empty{text-align:center;padding:25px;color:var(--muted)}
</style>
</head>
<body>
<div id="app"></div><div id="toast" class="toast"></div>
<script>
const API="/api";let currentUser=null,check={mood:"",factors:[],sleep:"7–8h",energy:"Good",fatigue:"Low",support:"Yes"},activities=[];
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
async function api(path,opt={}){let r=await fetch(API+path,{headers:{"Content-Type":"application/json"},...opt});let d=await r.json();if(!r.ok)throw Error(d.error||"Something went wrong");return d}
function toast(x){let t=document.getElementById("toast");t.textContent=x;t.style.display="block";setTimeout(()=>t.style.display="none",2300)}
function nav(role,active){let n=role==="welfare"?[["welfare","Overview"],["welfare-users","Personnel"],["welfare-analytics","Analytics"],["welfare-reports","Reports"]]:[["dashboard","Dashboard"],["checkin","Daily Check-in"],["activities","Activities"],["tracker","Tracker"],["insights","Insights"],["resources","Talk & Support"],["profile","Profile"]];return `<aside class="side"><div class="brand" style="color:#fff;margin:5px 10px 25px">Mind<span>Bloom</span></div><div style="font-size:11px;opacity:.55;padding:0 12px 8px;text-transform:uppercase">${role==="welfare"?"Welfare Console":"Personnel Portal"}</div>${n.map(x=>`<button class="nav ${active===x[0]?"on":""}" onclick="screen('${x[0]}')">${x[1]}</button>`).join("")}<button class="nav" onclick="logout()">Sign out</button></aside>`}
function shell(title,sub,body,role="personnel",active="dashboard"){return `<div class="top"><div class="brand">Mind<span>Bloom</span></div><div class="row"><span class="muted">${esc(currentUser?.name||"")}</span><button class="btn outline" onclick="logout()">Sign out</button></div></div><div class="layout">${nav(role,active)}<main class="main"><h1>${title}</h1><p class="sub">${sub}</p>${body}</main></div>`}
function auth(){document.getElementById("app").innerHTML=`<div class="auth"><section class="hero"><div class="brand" style="color:#fff">Mind<span>Bloom</span></div><h1>Understand your day. Build better habits.</h1><p>A simple preventive wellness companion: check in, receive practical recommendations, complete small activities, and see how your wellbeing changes over time.</p><div class="pill normal" style="width:max-content;margin-top:15px">Private • Supportive • Non-diagnostic</div></section><section class="authbox"><div class="formbox"><div class="brand">Mind<span>Bloom</span></div><p class="sub">Sign in to your personal wellness space.</p><div class="field"><label>Email</label><input id="email" value="personnel@mindbloom.local"></div><div class="field"><label>Password</label><input id="password" type="password" value="demo123"></div><button class="btn primary" style="width:100%" onclick="login()">Login</button><div style="height:10px"></div><button class="btn secondary" style="width:100%" onclick="demoLogin()">Use Personnel Demo</button><div style="height:10px"></div><button class="btn outline" style="width:100%" onclick="welfareLogin()">Use Welfare Demo</button><hr style="border:0;border-top:1px solid #eee;margin:22px 0"><p class="muted">New personnel?</p><button class="btn outline" style="width:100%" onclick="signup()">Create account</button></div></section></div>`}
function signup(){document.getElementById("app").innerHTML=`<div class="auth"><section class="hero"><div class="brand" style="color:#fff">Mind<span>Bloom</span></div><h1>Your wellbeing journey starts with one honest check-in.</h1><p>Create your account and tell MindBloom how your day is going.</p></section><section class="authbox"><div class="formbox"><h2>Create account</h2><div class="field"><label>Name</label><input id="sname" placeholder="Your name"></div><div class="field"><label>Email</label><input id="semail" placeholder="you@example.com"></div><div class="field"><label>Password</label><input id="spass" type="password" placeholder="At least 6 characters"></div><button class="btn primary" style="width:100%" onclick="register()">Create account</button><br><br><button class="btn outline" style="width:100%" onclick="auth()">Back to login</button></div></section></div>`}
async function login(){try{let d=await api("/login",{method:"POST",body:JSON.stringify({email:email.value,password:password.value})});currentUser=d.user;screen(currentUser.role==="welfare"?"welfare":"dashboard")}catch(e){toast(e.message)}}
function demoLogin(){email.value="personnel@mindbloom.local";password.value="demo123";login()}function welfareLogin(){email.value="welfare@mindbloom.local";password.value="demo123";login()}
async function register(){try{let d=await api("/register",{method:"POST",body:JSON.stringify({name:sname.value,email:semail.value,password:spass.value})});currentUser=d.user;screen("checkin")}catch(e){toast(e.message)}}
async function logout(){await api("/logout",{method:"POST"});currentUser=null;auth()}
function statusClass(s){return s==="Normal"?"normal":s==="Attention"?"attention":"concern"}

async function resourcesPanel(){
    try{
        const d=await api("/resources");
        const groups={};
        (d.resources||[]).forEach(r=>{
            (groups[r.category] ||= []).push(r);
        });
        return `
        <div class="card">
          <div class="row">
            <div>
              <h2>Need to talk to someone?</h2>
              <p class="muted">Verified government support and emergency contacts. Tap a number to call from your phone.</p>
            </div>
            <span class="pill normal">India</span>
          </div>
          <div class="resource-grid">
            ${(d.resources||[]).map(r=>`
              <div class="resource-card ${r.type==="emergency"?"urgent":""}">
                <div class="resource-top">
                  <div>
                    <div class="resource-category">${esc(r.category)}</div>
                    <h3>${esc(r.name)}</h3>
                  </div>
                  <div class="resource-number">${esc(r.number)}</div>
                </div>
                <p>${esc(r.description)}</p>
                <a class="btn ${r.type==="emergency"?"danger":"primary"} call-btn" href="tel:${r.number.replace(/[^0-9+]/g,"")}">Call ${esc(r.number)}</a>
              </div>
            `).join("")}
          </div>
          <div class="notice emergency-note">
            <b>If there is immediate danger or a medical emergency:</b>
            call <a href="tel:112"><b>112</b></a> now. MindBloom is not an emergency service.
          </div>
        </div>`;
    }catch(e){
        return `<div class="card"><h2>Support contacts</h2><p class="muted">Unable to load support contacts right now. If you are in immediate danger, call 112.</p></div>`;
    }
}

async function dashboard(){
    try{
        const d=await api("/dashboard");
        const taskHtml=(d.recommended_tasks||[]).length
          ? d.recommended_tasks.map(t=>`
              <div class="task-card">
                <div>
                  <span class="task-tag">Recommended</span>
                  <h3>${esc(t.title)}</h3>
                  <p>${esc(t.reason)}</p>
                </div>
                ${t.activity_id
                  ? `<button class="btn secondary" onclick="completeAndRefresh(${t.activity_id})">Do it</button>`
                  : `<button class="btn secondary" onclick="screen('resources')">Get support</button>`}
              </div>`).join("")
          : `<div class="empty"><p>Complete today's check-in and MindBloom will suggest tasks based on your answers.</p><button class="btn primary" onclick="screen('checkin')">Start check-in</button></div>`;

        let support="";
        if(d.last && (d.last.status==="Concern" || d.last.status==="Attention")){
            support=await resourcesPanel();
        }

        screenHtml(shell(
          "Your Wellness Dashboard",
          "A personalized view of your recent wellbeing, recommended actions and support options.",
          `
          <div class="grid g4">
            <div class="card">
              <div class="muted">Today's status</div>
              <div class="stat">${d.last?esc(d.last.status):"Not checked"}</div>
              ${d.last?`<span class="pill ${statusClass(d.last.status)}">${esc(d.last.status)}</span>`:""}
            </div>
            <div class="card"><div class="muted">Check-ins</div><div class="stat">${d.checkins}</div><div class="muted">saved in your tracker</div></div>
            <div class="card"><div class="muted">Activities</div><div class="stat">${d.completed}</div><div class="muted">completed</div></div>
            <div class="card"><div class="muted">Next step</div><div class="stat">Today</div><div class="muted">keep your routine going</div></div>
          </div>

          <br>

          <div class="grid g2">
            <div class="card">
              <div class="row">
                <div>
                  <h2>How are you today?</h2>
                  <p class="muted">Your answers drive the recommendations below.</p>
                </div>
                <button class="btn primary" onclick="screen('checkin')">Check in</button>
              </div>
              ${d.last?`
                <div class="metric"><span>Feeling</span><b>${esc(d.last.mood)}</b></div>
                <div class="metric"><span>Sleep</span><b>${esc(d.last.sleep)}</b></div>
                <div class="metric"><span>Energy</span><b>${esc(d.last.energy)}</b></div>
                <div class="metric"><span>Fatigue</span><b>${esc(d.last.fatigue)}</b></div>
                <div class="metric"><span>Factors</span><b>${esc(d.last.factors||"None")}</b></div>
              `:`<div class="empty">No check-in yet.</div>`}
            </div>

            <div class="card">
              <h2>Recommended for you</h2>
              <p class="muted">Suggestions change according to your latest answers.</p>
              <div class="stack">${taskHtml}</div>
            </div>
          </div>

          <br>
          ${support}
          ${!support?`
          <div class="card">
            <div class="row">
              <div><h2>Talk to someone</h2><p class="muted">You never have to handle everything alone. Government support contacts are available from the Support section.</p></div>
              <button class="btn secondary" onclick="screen('resources')">View support contacts</button>
            </div>
          </div>`:""}
          `,
          "personnel",
          "dashboard"
        ));
    }catch(e){ toast(e.message||"Unable to load dashboard."); }
}

async function completeAndRefresh(id){
    await complete(id);
    await dashboard();
}

function screenHtml(x){document.getElementById("app").innerHTML=x}
function screen(s){if(s==="dashboard")return dashboard();if(s==="checkin")return checkin();if(s==="activities")return activityPage();if(s==="tracker")return tracker();if(s==="insights")return insights();if(s==="profile")return profile();if(s==="resources")return supportResources();if(s==="welfare")return welfare();if(s==="welfare-users")return welfareUsers();if(s==="welfare-analytics")return welfareAnalytics();if(s==="welfare-reports")return welfareReports()}
function checkin(){screenHtml(shell("Daily Wellness Check-in","There are no right or wrong answers. Answer only what you are comfortable sharing.",`<div class="card checkin"><h2>How are you feeling today?</h2><div class="grid g3">${[["😞","Very Low"],["🙁","Low"],["😐","Okay"],["🙂","Good"],["😄","Very Good"]].map(x=>`<button class="choice ${check.mood===x[1]?"sel":""}" onclick="check.mood='${x[1]}';checkin()"><div class="mood">${x[0]}</div><b>${x[1]}</b></button>`).join("")}</div><br><h2>What's affecting you?</h2><p class="muted">Select anything that feels relevant.</p><div class="grid g3">${["Workload","Duty pressure","Lack of sleep","Team/colleague pressure","Family concerns","Personal concerns","Financial concerns","Physical fatigue","Nothing specific","Prefer not to say"].map(x=>`<button class="choice ${check.factors.includes(x)?"sel":""}" onclick="factor('${x}')">${x}</button>`).join("")}</div><br><div class="grid g3"><div class="field"><label>Sleep last night</label><select onchange="check.sleep=this.value"><option>7–8h</option><option>6–7h</option><option>5–6h</option><option>&lt;5h</option></select></div><div class="field"><label>Energy</label><select onchange="check.energy=this.value"><option>Good</option><option>Okay</option><option>Low</option></select></div><div class="field"><label>Physical fatigue</label><select onchange="check.fatigue=this.value"><option>Low</option><option>Moderate</option><option>High</option></select></div></div><h2>Do you have someone you can talk to if needed?</h2><div class="grid g4">${["Yes","Maybe","No","Prefer not to say"].map(x=>`<button class="choice ${check.support===x?"sel":""}" onclick="check.support='${x}';checkin()">${x}</button>`).join("")}</div><br><button class="btn primary" onclick="submitCheckin()">See my recommendations</button></div>`,"personnel","checkin"))}
function factor(x){check.factors=check.factors.includes(x)?check.factors.filter(y=>y!==x):[...check.factors,x];checkin()}
async function submitCheckin(){if(!check.mood)return toast("Please select how you are feeling.");try{let d=await api("/checkins",{method:"POST",body:JSON.stringify(check)});screenHtml(shell("Your Wellness Pattern","Based on today's answers, here are supportive next steps.",`<div class="card result"><div class="row"><div><div class="muted">Today's pattern</div><div class="stat">${d.status}</div></div><span class="pill ${statusClass(d.status)}">${d.score}/100 indicator</span></div><p style="font-size:16px;margin-top:20px">${esc(d.recommendation)}</p></div><br><div class="grid g3"><div class="card"><h2>Recommended</h2><p class="muted">Try a short activity matched to your responses.</p><button class="btn primary" onclick="screen('activities')">View activities</button></div><div class="card"><h2>See your journey</h2><p class="muted">Compare today with previous days.</p><button class="btn secondary" onclick="screen('tracker')">Open tracker</button></div><div class="card"><h2>Need support?</h2><p class="muted">Consider an approved welfare or professional support pathway if you need one.</p><button class="btn secondary" onclick="toast('Please use your organization’s approved support pathway for urgent help.')">Support options</button></div></div>`,"personnel","checkin"))}catch(e){toast(e.message)}}
async function activityPage(){let d=await api("/activities");activities=d.activities;screenHtml(shell("Wellness Activities","Small actions you can complete today.",`<div class="grid g3">${activities.map(a=>`<div class="card"><div style="font-size:30px">${a.category==="Sleep"?"☾":a.category==="Movement"?"↗":a.category==="Breathing"?"◌":"◒"}</div><span class="pill normal">${esc(a.category)}</span><h2 style="margin-top:10px">${esc(a.title)}</h2><p class="muted">${esc(a.description)}</p><p><b>${esc(a.duration)}</b></p><button class="btn primary" onclick="complete(${a.id})">Complete activity</button></div>`).join("")}</div>`,"personnel","activities"))}
async function complete(id){try{await api("/activities/"+id+"/complete",{method:"POST"});toast("Activity completed");activityPage()}catch(e){toast(e.message)}}
async function tracker(){let d=await api("/checkins");screenHtml(shell("Wellness Tracker","See what you were feeling on each day and what factors you reported.",`<div class="card"><div class="row"><h2>Your days</h2><button class="btn primary" onclick="screen('checkin')">New check-in</button></div>${d.checkins.length?`<table class="table"><thead><tr><th>Date</th><th>Feeling</th><th>Status</th><th>Sleep</th><th>Factors</th></tr></thead><tbody>${d.checkins.map(x=>`<tr><td>${esc(x.checkin_date)}</td><td>${esc(x.mood)}</td><td><span class="pill ${statusClass(x.status)}">${x.status}</span></td><td>${esc(x.sleep)}</td><td>${esc(x.factors||"None")}</td></tr>`).join("")}</tbody></table>`:`<div style="padding:50px;text-align:center;color:var(--muted)">No check-ins yet. Complete your first one.</div>`}</div>`,"personnel","tracker"))}
async function insights(){let d=await api("/checkins");let avg=d.checkins.length?Math.round(d.checkins.reduce((a,x)=>a+x.score,0)/d.checkins.length):0;screenHtml(shell("Wellness Insights","Patterns are based on your own check-in history.",`<div class="grid g3"><div class="card"><div class="muted">Average indicator</div><div class="stat">${avg}/100</div></div><div class="card"><div class="muted">Check-ins recorded</div><div class="stat">${d.checkins.length}</div></div><div class="card"><div class="muted">Latest state</div><div class="stat">${d.checkins[0]?.status||"—"}</div></div></div><br><div class="card"><h2>Recent pattern</h2>${d.checkins.slice(0,7).map(x=>`<div style="margin:14px 0"><div class="row"><span>${x.checkin_date} · ${x.mood}</span><b>${x.score}</b></div><div class="progress"><i style="width:${x.score}%"></i></div></div>`).join("")||"<p class='muted'>Complete a check-in to create your trend.</p>"}</div>`,"personnel","insights"))}

async function supportResources(){
    const content=await resourcesPanel();
    screenHtml(shell(
        "Talk & Support",
        "Government helplines and emergency contacts you can call directly.",
        content,
        "personnel",
        "resources"
    ));
}

function profile(){screenHtml(shell("Profile","Your account details.",`<div class="card" style="max-width:700px"><div class="field"><label>Name</label><input value="${esc(currentUser?.name)}" disabled></div><div class="field"><label>Email</label><input value="${esc(currentUser?.email)}" disabled></div><div class="notice" style="padding:14px;background:var(--soft)">MindBloom uses your responses to personalize your wellness experience. It is not a diagnostic system and should not be used for personnel performance ranking.</div></div>`,"personnel","profile"))}
async function welfare() {
    try {
        const d = await api("/welfare/overview");

        const factorsHtml = (d.factors || []).map(x => `
            <div class="row" style="padding:12px 0;border-bottom:1px solid var(--line)">
                <span>${esc(x[0])}</span>
                <b>${x[1]}</b>
            </div>
        `).join("");

        const content = `
            <div class="grid g4">

                <div class="card">
                    <div class="muted">Personnel</div>
                    <div class="stat">${d.total || 0}</div>
                </div>

                <div class="card">
                    <div class="muted">Stable</div>
                    <div class="stat">${d.stable || 0}</div>
                    <span class="pill normal">Normal</span>
                </div>

                <div class="card">
                    <div class="muted">Attention</div>
                    <div class="stat">${d.attention || 0}</div>
                    <span class="pill attention">Monitor</span>
                </div>

                <div class="card">
                    <div class="muted">Concern</div>
                    <div class="stat">${d.concern || 0}</div>
                    <span class="pill concern">Support</span>
                </div>

            </div>

            <br>

            <div class="grid g2">

                <div class="card">
                    <h2>Common factors</h2>
                    ${factorsHtml || `
                        <p class="muted">
                            No wellbeing factors recorded yet.
                        </p>
                    `}
                </div>

                <div class="card">
                    <h2>Privacy boundary</h2>

                    <p class="muted">
                        This console is designed around aggregated welfare trends.
                        Individual private check-in responses are not displayed here
                        by default.
                    </p>

                    <div class="notice">
                        <strong>Privacy-first approach</strong>
                        <p class="muted">
                            Use aggregated trends to understand broader welfare needs,
                            not to monitor or rank individual personnel.
                        </p>
                    </div>
                </div>

            </div>
        `;

        screenHtml(
            shell(
                "Welfare Overview",
                "Aggregated, privacy-conscious wellbeing intelligence.",
                content,
                "welfare",
                "welfare"
            )
        );

    } catch (error) {
        console.error("Welfare dashboard error:", error);

        screenHtml(
            shell(
                "Welfare Overview",
                "Unable to load welfare information.",
                `
                    <div class="card">
                        <h2>Something went wrong</h2>
                        <p class="muted">
                            We could not load the aggregated welfare data.
                            Please refresh the page and try again.
                        </p>
                    </div>
                `,
                "welfare",
                "welfare"
            )
        );
    }
}
